services:
  postgres:
    image: postgres:16
    container_name: sistema-caixa-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: sistema_caixa
      POSTGRES_USER: caixa_user
      POSTGRES_PASSWORD: caixa_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: